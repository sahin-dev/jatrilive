    <title>JatriLive · Offline</title>

      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffefa;color:#15231d;font-family:Arial,sans-serif}main{width:min(420px,calc(100% - 40px));text-align:center}.mark{width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:17px;background:#ff5c35;color:white;font-size:25px;font-weight:800}h1{margin:22px 0 8px}p{color:#6c7871;line-height:1.6}button{margin-top:15px;border:0;border-radius:11px;padding:13px 20px;background:#173f35;color:white;font-weight:700;cursor:pointer}

  </head>
  <body><main><div class="mark">J</div><h1>You’re offline</h1><p>Reconnect to see fresh bus locations and ETAs. JatriLive never presents cached positions as live.</p><button onclick="location.reload()">Try again</button></main></body>
